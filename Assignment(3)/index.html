<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS-309 Assignment Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .portal-container {
            text-align: center;
            max-width: 400px;
            margin: 40px auto;
        }
        .portal-container h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        .portal-container p {
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .link-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .portal-btn {
            display: block;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
        }
        .portal-btn.secondary {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

<div class="wrapper portal-container">
    <h1>CS-309 Portal</h1>
    <p>Choose an action below:</p>
    
    <div class="link-group">
        <a href="validation.html" class="portal-btn">Registration Form</a>
        <a href="data.html" class="portal-btn secondary">Personnel Directory</a>
    </div>
</div>

</body>
</html>
