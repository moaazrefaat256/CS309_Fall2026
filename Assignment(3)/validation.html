<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration & Validation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper">
    <h2>Create Your Account</h2>
    <form id="registrationForm" novalidate>
        
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">
            <span id="nameError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com">
            <span id="emailError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters">
            <span id="passwordError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password">
            <span id="confirmPasswordError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter your age">
            <span id="ageError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="e.g., Cairo, New York, London">
            <span id="cityError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="profession">Profession</label>
            <input type="text" id="profession" name="profession" placeholder="e.g., Software Engineer">
            <span id="professionError" class="error-message"></span>
        </div>

        <button type="submit" class="btn-submit">Register & Add to Directory</button>
        <div id="successMessage" class="success-banner">Registration successful! Added to data directory.</div>
    </form>

    <div class="nav-link">
        <a href="data.html">&rarr; View Personnel Directory & Data Table</a>
        <br><br>
        <a href="index.html">&larr; Back to Home Portal</a>
    </div>
</div>

<script>
    const form = document.getElementById('registrationForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const ageInput = document.getElementById('age');
    const cityInput = document.getElementById('city');
    const professionInput = document.getElementById('profession');

    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const ageError = document.getElementById('ageError');
    const cityError = document.getElementById('cityError');
    const professionError = document.getElementById('professionError');
    const successMessage = document.getElementById('successMessage');

    nameInput.addEventListener('input', validateName);
    emailInput.addEventListener('input', validateEmail);
    passwordInput.addEventListener('input', validatePassword);
    confirmPasswordInput.addEventListener('input', validateConfirmPassword);
    ageInput.addEventListener('input', validateAge);
    cityInput.addEventListener('input', validateCity);
    professionInput.addEventListener('input', validateProfession);

    function validateName() {
        if (nameInput.value.trim() === '') {
            nameError.textContent = 'Full name is required.';
            return false;
        } else if (nameInput.value.trim().length < 3) {
            nameError.textContent = 'Name must be at least 3 characters long.';
            return false;
        } else {
            nameError.textContent = '';
            return true;
        }
    }

    function validateEmail() {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailInput.value.trim() === '') {
            emailError.textContent = 'Email address is required.';
            return false;
        } else if (!emailRegex.test(emailInput.value.trim())) {
            emailError.textContent = 'Please enter a valid email address.';
            return false;
        } else {
            emailError.textContent = '';
            return true;
        }
    }

    function validatePassword() {
        if (passwordInput.value === '') {
            passwordError.textContent = 'Password is required.';
            return false;
        } else if (passwordInput.value.length < 8) {
            passwordError.textContent = 'Password must be at least 8 characters long.';
            return false;
        } else {
            passwordError.textContent = '';
            return true;
        }
    }

    function validateConfirmPassword() {
        if (confirmPasswordInput.value === '') {
            confirmPasswordError.textContent = 'Please confirm your password.';
            return false;
        } else if (confirmPasswordInput.value !== passwordInput.value) {
            confirmPasswordError.textContent = 'Passwords do not match.';
            return false;
        } else {
            confirmPasswordError.textContent = '';
            return true;
        }
    }

    function validateAge() {
        const ageVal = Number(ageInput.value);
        if (ageInput.value.trim() === '') {
            ageError.textContent = 'Age is required.';
            return false;
        } else if (isNaN(ageVal) || ageVal < 18 || ageVal > 100) {
            ageError.textContent = 'Please enter a valid age between 18 and 100.';
            return false;
        } else {
            ageError.textContent = '';
            return true;
        }
    }

    function validateCity() {
        if (cityInput.value.trim() === '') {
            cityError.textContent = 'City is required.';
            return false;
        } else {
            cityError.textContent = '';
            return true;
        }
    }

    function validateProfession() {
        if (professionInput.value.trim() === '') {
            professionError.textContent = 'Profession is required.';
            return false;
        } else {
            professionError.textContent = '';
            return true;
        }
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const isNameValid = validateName();
        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();
        const isConfirmValid = validateConfirmPassword();
        const isAgeValid = validateAge();
        const isCityValid = validateCity();
        const isProfValid = validateProfession();

        if (isNameValid && isEmailValid && isPasswordValid && isConfirmValid && isAgeValid && isCityValid && isProfValid) {
            const newUser = {
                name: nameInput.value.trim(),
                age: Number(ageInput.value.trim()),
                city: cityInput.value.trim(),
                profession: professionInput.value.trim()
            };

            // Start empty if no user added yet (NO dummy test data!)
            let existingData = JSON.parse(localStorage.getItem('personnelData')) || [];

            existingData.unshift(newUser);
            localStorage.setItem('personnelData', JSON.stringify(existingData));

            successMessage.style.display = 'block';
            form.reset();
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);
        } else {
            successMessage.style.display = 'none';
        }
    });
</script>

</body>
</html>
