<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Directory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper">
    <h2>Personnel Directory</h2>

    <div class="table-controls">
        <input type="text" id="searchInput" placeholder="Search name, city, profession...">
        <div class="sort-group">
            <button id="sortNameBtn" class="btn-sort">Sort Name</button>
            <button id="sortAgeBtn" class="btn-sort">Sort Age</button>
        </div>
    </div>

    <!-- Clear mobile swipe instructions -->
    <div class="scroll-hint">👉 اسحب الجدول يميناً ويساراً لمشاهدة باقي الأعمدة وأزرار التعديل والحذف</div>

    <!-- Scrollable container -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                    <th>Profession</th>
                    <th style="width: 110px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamic rows -->
            </tbody>
        </table>
    </div>

    <div class="nav-link">
        <a href="validation.html">&larr; Back to Registration Form</a>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <a href="index.html">Back to Home</a>
    </div>
</div>

<script>
    // Clean up and load data, strictly ignoring any old default test data
    let rawData = JSON.parse(localStorage.getItem('personnelData')) || [];
    const legacyNames = ["Alexander Wright", "Victoria Sterling", "Liam O'Connor", "Sophia Martinez", "Hiroshi Tanaka"];
    let personnelData = rawData.filter(item => !legacyNames.includes(item.name));
    
    // Save back cleaned data
    localStorage.setItem('personnelData', JSON.stringify(personnelData));

    let currentData = [...personnelData];
    let sortNameAsc = true;
    let sortAgeAsc = true;

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const sortNameBtn = document.getElementById('sortNameBtn');
    const sortAgeBtn = document.getElementById('sortAgeBtn');

    function renderTable(data) {
        tableBody.innerHTML = '';
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" class="no-results">No records found. Please submit a registration first.</td></tr>';
            return;
        }

        data.forEach((person, index) => {
            const originalIndex = personnelData.indexOf(person);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${person.name}</strong></td>
                <td>${person.age}</td>
                <td>${person.city}</td>
                <td>${person.profession}</td>
                <td class="action-cell">
                    <button class="btn-action btn-edit" onclick="editRecord(${originalIndex})">Edit</button>
                    <button class="btn-action btn-delete" onclick="deleteRecord(${originalIndex})">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    window.deleteRecord = function(index) {
        if (confirm("Are you sure you want to delete this profile?")) {
            personnelData.splice(index, 1);
            localStorage.setItem('personnelData', JSON.stringify(personnelData));
            currentData = [...personnelData];
            renderTable(currentData);
        }
    };

    window.editRecord = function(index) {
        const person = personnelData[index];
        const newName = prompt("Edit Full Name:", person.name);
        if (newName === null) return;

        const newAge = prompt("Edit Age:", person.age);
        if (newAge === null) return;

        const newCity = prompt("Edit City:", person.city);
        if (newCity === null) return;

        const newProfession = prompt("Edit Profession:", person.profession);
        if (newProfession === null) return;

        if (newName.trim() === '' || newAge.trim() === '' || newCity.trim() === '' || newProfession.trim() === '') {
            alert("All fields are required!");
            return;
        }

        personnelData[index] = {
            name: newName.trim(),
            age: Number(newAge.trim()),
            city: newCity.trim(),
            profession: newProfession.trim()
        };

        localStorage.setItem('personnelData', JSON.stringify(personnelData));
        currentData = [...personnelData];
        renderTable(currentData);
    };

    searchInput.addEventListener('input', function() {
        const query = searchInput.value.toLowerCase().trim();
        currentData = personnelData.filter(person => 
            person.name.toLowerCase().includes(query) ||
            person.city.toLowerCase().includes(query) ||
            person.profession.toLowerCase().includes(query) ||
            person.age.toString().includes(query)
        );
        renderTable(currentData);
    });

    sortNameBtn.addEventListener('click', function() {
        currentData.sort((a, b) => {
            return sortNameAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
        });
        sortNameAsc = !sortNameAsc;
        sortNameBtn.textContent = sortNameAsc ? 'Sort Name (A-Z)' : 'Sort Name (Z-A)';
        renderTable(currentData);
    });

    sortAgeBtn.addEventListener('click', function() {
        currentData.sort((a, b) => {
            return sortAgeAsc ? a.age - b.age : b.age - a.age;
        });
        sortAgeAsc = !sortAgeAsc;
        sortAgeBtn.textContent = sortAgeAsc ? 'Sort Age (Low-High)' : 'Sort Age (High-Low)';
        renderTable(currentData);
    });

    renderTable(personnelData);
</script>

</body>
</html>
