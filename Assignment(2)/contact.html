<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Campus Cafe or place an online coffee order.">
    <title>Campus Cafe - Contact</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <header>
        <h1>Campus Cafe</h1>
        
        <div class="theme-switch-wrapper">
            <input type="checkbox" id="theme-toggle" class="theme-toggle-input">
            <label for="theme-toggle" class="theme-toggle-label" aria-label="Toggle dark mode">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
                <span class="toggle-ball"></span>
            </label>
        </div>

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact/Order</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Contact Us or Place an Order</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Number of Items:</label>
                    <input type="number" id="quantity" name="quantity" min="1" max="20" value="1">
                </div>

                <div class="form-group">
                    <label for="pickup_date">Pickup Date:</label>
                    <input type="date" id="pickup_date" name="pickup_date">
                </div>
                
                <fieldset class="form-group" style="border: none; padding: 0; margin: 0 0 15px 0;">
                    <legend style="font-weight: bold; margin-bottom: 5px;">Order Type:</legend>
                    <div class="radio-group">
                        <input type="radio" id="pickup" name="orderType" value="pickup" checked>
                        <label for="pickup">Pickup</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="dinein" name="orderType" value="dinein">
                        <label for="dinein">Dine-in</label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="drink">Favorite Drink:</label>
                    <select id="drink" name="drink">
                        <option value="espresso">Espresso</option>
                        <option value="latte">Latte</option>
                        <option value="tea">Tea</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Notes:</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to our student newsletter</label>
                </div>

                <button type="submit" class="btn">Submit Order</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Cafe. Built for the final project.</p>
    </footer>
</body>
</html>
